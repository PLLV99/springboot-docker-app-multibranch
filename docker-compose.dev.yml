# =================================================================
# Local development environment (hot-reload)
#
# Usage:  docker compose -f docker-compose.dev.yml up
#
# How it works:
#   - Builds ONLY the `build` stage of the Dockerfile (Maven + JDK
#     + inotify-tools already baked in)
#   - Mounts ./src and ./pom.xml so edits on the host are seen
#     instantly inside the container
#   - An inotify watcher recompiles on file change; Spring Boot
#     DevTools detects the new classes and restarts the app
#
# Port map on this machine:
#   8080 = PROD  (deployed by Jenkins)
#   8081 = DEV   (deployed by Jenkins)
#   8082 = local dev (this file) — all three can run simultaneously
# =================================================================

services:
  app-dev:
    build:
      context: .
      # Stop at stage 1 of the Dockerfile — we want the Maven toolbox,
      # not the slim runtime image.
      target: build
    container_name: springboot-app-dev-instance
    ports:
      - "8082:8080"   # host:container
    volumes:
      # Live-mount source so host edits appear inside the container
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      # Named volume caches the local Maven repo (~/.m2) between runs,
      # so dependencies aren't re-downloaded every `compose up`
      - maven-repo:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
    # Hot-reload loop:
    #   background: watch src/ → recompile on any change
    #   foreground: run the app via spring-boot:run
    # DevTools (already a project dependency) watches the compiled
    # classpath and restarts automatically when classes change —
    # no extra DevTools config needed.
    command: >-
      sh -c "
      ( while inotifywait -r -e modify,create,delete src/main/java src/main/resources; do mvn -q -DskipTests=true compile; done ) & \
      mvn -B -ntp -Dspring-boot.run.profiles=dev spring-boot:run
      "

volumes:
  maven-repo: